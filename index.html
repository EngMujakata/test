<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b8f87"><meta name="description" content="ENICAN MINES management system"><link rel="manifest" href="manifest.json"><link rel="icon" href="logo 192.png"><title>ENICAN MINES</title>
<style>
:root{--bg:#f4f7f8;--card:#fff;--text:#132124;--muted:#6b7b80;--line:#e5ecee;--brand:#0b8f87;--brand2:#08736d;--danger:#d9534f;--warn:#d99000;--ok:#15966e;--shadow:0 10px 30px rgba(16,42,45,.07);--r:18px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.hidden{display:none!important}.app{min-height:100vh}.top{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 20px;position:sticky;top:0;z-index:30}.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.02em}.brand img{width:36px;height:36px;border-radius:10px}.top-right{margin-left:auto;display:flex;align-items:center;gap:8px}.user-pill{background:#f0f6f6;padding:8px 12px;border-radius:999px;font-size:13px}.icon-btn{width:38px;height:38px;border-radius:12px;background:#f2f6f6;color:#285052}.layout{display:flex;min-height:calc(100vh - 64px)}.side{width:235px;background:#fff;border-right:1px solid var(--line);padding:16px 12px;position:fixed;top:64px;bottom:0;z-index:20}.nav{display:grid;gap:5px}.nav button{background:transparent;text-align:left;padding:12px 13px;border-radius:12px;color:#536568}.nav button.active,.nav button:hover{background:#eaf7f5;color:var(--brand2);font-weight:700}.main{margin-left:235px;width:calc(100% - 235px);padding:24px;max-width:1500px}.section-head{display:flex;align-items:center;gap:12px;margin-bottom:18px}.section-head h1{margin:0;font-size:25px}.section-head .actions{margin-left:auto;display:flex;gap:8px}.refresh{background:#fff;border:1px solid var(--line);width:40px;height:40px;border-radius:12px;box-shadow:0 2px 8px #00000008}.grid{display:grid;gap:14px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:18px}.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}.stat small{color:var(--muted);display:block;margin-bottom:8px}.stat strong{font-size:27px}.cards{grid-template-columns:repeat(4,minmax(0,1fr))}.asset{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow);text-align:left;transition:.15s}.asset:hover{transform:translateY(-2px);border-color:#b7d9d6}.asset .asset-top{display:flex;justify-content:space-between;gap:8px}.asset h3{margin:0 0 10px;font-size:17px}.status{font-size:11px;padding:5px 8px;border-radius:999px;font-weight:800}.vacant{background:#e9f8f1;color:#087b58}.occupied{background:#fff4df;color:#a96b00}.pending{background:#eeeafd;color:#6653bd}.declined{background:#fde9e8;color:#b83e3a}.asset-meta{color:var(--muted);font-size:13px;line-height:1.6}.panel{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;margin-bottom:16px}.panel h2,.panel h3{margin:0 0 14px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field label{display:block;font-size:12px;color:var(--muted);font-weight:700;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;border:1px solid #d9e3e5;border-radius:11px;padding:11px 12px;background:#fff;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px #0b8f8712}.btn{padding:11px 15px;border-radius:11px;font-weight:700}.primary{background:var(--brand);color:#fff}.secondary{background:#edf5f4;color:#175d59}.danger{background:#fff0ef;color:#b23e3a}.ghost{background:#fff;border:1px solid var(--line)}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.search{position:relative}.search input{padding-left:38px}.search span{position:absolute;left:12px;top:10px;color:#8a9a9e}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{border:1px solid var(--line);background:#fff;padding:9px 12px;border-radius:999px}.chip.selected{background:#e6f7f4;border-color:#8bcfc8;color:#076f69;font-weight:800}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:680px}.table th,.table td{padding:12px 10px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}.table th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em}.empty{text-align:center;padding:35px;color:var(--muted)}.modal-back{position:fixed;inset:0;background:#12242680;display:flex;align-items:center;justify-content:center;padding:18px;z-index:80}.modal{background:#fff;border-radius:20px;width:min(760px,100%);max-height:90vh;overflow:auto;box-shadow:0 25px 80px #0003}.modal-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center}.modal-head h2{margin:0;font-size:19px}.modal-head button{margin-left:auto;background:#f2f5f5;width:34px;height:34px;border-radius:10px}.modal-body{padding:20px}.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 20% 10%,#dff4f0,transparent 35%),var(--bg)}.login-card{width:min(420px,100%);background:#fff;border:1px solid var(--line);border-radius:24px;padding:30px;box-shadow:0 25px 70px #16363815}.login-logo{text-align:center}.login-logo img{width:72px;height:72px;border-radius:20px}.login h1{text-align:center;margin:14px 0 4px}.login p{text-align:center;color:var(--muted);margin:0 0 24px}.stack{display:grid;gap:12px}.toast{position:fixed;right:18px;bottom:18px;z-index:100;background:#172a2c;color:#fff;padding:13px 16px;border-radius:12px;box-shadow:var(--shadow);max-width:360px}.report-boxes{grid-template-columns:repeat(3,minmax(0,1fr));margin-bottom:18px}.report-box{padding:20px;border-radius:18px;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);cursor:pointer}.report-box h3{margin:0 0 7px}.report-box strong{font-size:26px}.sub{color:var(--muted);font-size:13px}.banner{padding:12px 14px;border-radius:12px;background:#fff7e5;color:#8d6000;border:1px solid #f0dfb2;margin-bottom:15px}.approval{border-left:4px solid var(--warn)}.mobile-nav{display:none}.offline{font-size:11px;color:#b36b00}.pdf-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:15px}
@media(max-width:900px){.side{display:none}.main{margin-left:0;width:100%;padding:16px 12px 80px}.stats,.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.report-boxes{grid-template-columns:1fr}.mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;height:62px;background:#fff;border-top:1px solid var(--line);z-index:40;justify-content:space-around;padding:7px}.mobile-nav button{background:transparent;color:#65777a;font-size:10px}.mobile-nav button.active{color:var(--brand2);font-weight:800}.top{padding:0 12px}.user-pill{display:none}.form-grid{grid-template-columns:1fr}.modal-back{padding:0;align-items:flex-end}.modal{border-radius:20px 20px 0 0;max-height:92vh}.table{min-width:620px}}
@media(max-width:520px){.stats,.cards{grid-template-columns:1fr 1fr}.stat{padding:14px}.stat strong{font-size:21px}.asset{padding:15px}.section-head h1{font-size:21px}.top .brand span{display:none}}
</style></head>
<body>
<div id="loginView" class="login"><div class="login-card"><div class="login-logo"><img src="logo 192.png" onerror="this.style.display='none'"><h1>ENICAN MINES</h1><p>Management System</p></div><form id="loginForm" class="stack"><div class="sub" style="background:#f2f7f6;padding:10px 12px;border-radius:10px;text-align:left">Connected to ENICAN MINES live server</div><div class="field"><label>Username</label><input id="loginUser" autocomplete="username" autocapitalize="none" required></div><div class="field"><label>Password</label><input id="loginPass" type="password" autocomplete="current-password" required></div><div class="field"><label>Role</label><select id="loginRole" required><option value="">Select role</option><option value="admin">Admin</option><option value="loader">Loader</option><option value="boiler">Boiler</option><option value="driver">Driver</option></select></div><button class="btn primary" type="submit">Sign In</button><div id="loginError" class="sub"></div></form></div></div>
<div id="app" class="app hidden"><header class="top"><div class="brand"><img src="logo 192.png" onerror="this.style.display='none'"><span>ENICAN MINES</span></div><div id="offline" class="offline"></div><div class="top-right"><div id="userPill" class="user-pill"></div><button class="icon-btn" onclick="logout()" title="Logout">↪</button></div></header><div class="layout"><aside class="side"><nav id="nav" class="nav"></nav></aside><main id="main" class="main"></main></div><nav id="mobileNav" class="mobile-nav"></nav></div>
<div id="modalBack" class="modal-back hidden"><div id="modal" class="modal"><div class="modal-head"><h2 id="modalTitle"></h2><button onclick="closeModal()">×</button></div><div id="modalBody" class="modal-body"></div></div></div><div id="toast" class="toast hidden"></div><div id="installBack" class="modal-back hidden"><div class="modal" style="max-width:430px"><div class="modal-head"><h2>Install ENICAN MINES</h2><button onclick="closeInstall()">×</button></div><div class="modal-body" id="installBody"></div></div></div>
<script>
const CONFIG={API_URL:'https://script.google.com/macros/s/AKfycbyqtcVWtiDIE5_V2WFStmyxqeqkvIkSyqolmnC94Cda9gix_G42QETtCRSZzuD_5Wo/exec',POLL_MS:5000};
let deferredInstallPrompt=null;
let state={token:null,user:null,page:'dashboard',timer:null,data:null,selectedAccount:'TANK'};
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const money=n=>'$'+Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});

function isStandalone(){return window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true}
function closeInstall(){$('installBack').classList.add('hidden')}
function showInstallPrompt(){if(isStandalone()||sessionStorage.getItem('enicanInstallShown'))return;sessionStorage.setItem('enicanInstallShown','1');const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);if(deferredInstallPrompt){$('installBody').innerHTML='<p>Install ENICAN MINES on this device for a faster app-like experience and quick access.</p><button class="btn primary" style="width:100%" onclick="installPWA()">Install App</button>'}else if(ios){$('installBody').innerHTML='<p>On your iPhone or iPad, tap the <strong>Share</strong> icon in Safari, then choose <strong>Add to Home Screen</strong>.</p><div class="panel" style="margin:0">Safari → Share <strong>↗</strong> → Add to Home Screen → Add</div>'}else{$('installBody').innerHTML='<p>Use your browser menu and choose <strong>Install ENICAN MINES</strong> or <strong>Add to Home Screen</strong>.</p>'}$('installBack').classList.remove('hidden')}
async function installPWA(){if(!deferredInstallPrompt)return;deferredInstallPrompt.prompt();const r=await deferredInstallPrompt.userChoice;deferredInstallPrompt=null;closeInstall();if(r.outcome==='accepted')toast('ENICAN MINES installed.')}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstallPrompt=e;setTimeout(showInstallPrompt,700)})
window.addEventListener('appinstalled',()=>{deferredInstallPrompt=null;closeInstall()})
setTimeout(showInstallPrompt,1800)
function toast(m){$('toast').textContent=m;$('toast').classList.remove('hidden');clearTimeout(window._toast);window._toast=setTimeout(()=>$('toast').classList.add('hidden'),3500)}
function showModal(title,html){$('modalTitle').textContent=title;$('modalBody').innerHTML=html;$('modalBack').classList.remove('hidden')}
function closeModal(){$('modalBack').classList.add('hidden')}
function apiUrl(){if(!CONFIG.API_URL){throw new Error('API URL is not configured. Open Settings and save your Apps Script Web App URL.')}return CONFIG.API_URL}
async function apiGet(action,params={}){const url=new URL(apiUrl());url.searchParams.set('action',action);if(state.token)url.searchParams.set('token',state.token);Object.entries(params).forEach(([k,v])=>{if(v!==undefined&&v!==null)url.searchParams.set(k,typeof v==='object'?JSON.stringify(v):v)});const r=await fetch(url,{cache:'no-store'});const j=await r.json();if(!j.ok)throw new Error(j.error||'Request failed');return j.data}
let writeChain=Promise.resolve();
function apiWrite(action,params={}){writeChain=writeChain.then(()=>apiGet(action,params));return writeChain}
function navItems(){const a=[['dashboard','Dashboard','⌂']];if(['loader','admin'].includes(state.user.role))a.push(['load','Load Tank','＋']);if(['boiler','admin'].includes(state.user.role))a.push(['boilerLoad','Load Boiler','♨']);if(['loader','admin'].includes(state.user.role))a.push(['empty','Empty Tank','⇩']);if(['boiler','admin'].includes(state.user.role))a.push(['boilerEmpty','Empty Boiler','⇩']);if(state.user.role==='driver')a.push(['driver','Grabber','🚚']);a.push(['reports','Reports','▥']);if(state.user.role==='admin')a.push(['approvals','Approvals','✓'],['audit','Audit Trail','◷'],['settings','Settings','⚙']);return a}
function renderNav(){const items=navItems();$('nav').innerHTML=items.map(x=>`<button class="${state.page===x[0]?'active':''}" onclick="go('${x[0]}')">${x[2]} &nbsp; ${x[1]}</button>`).join('');$('mobileNav').innerHTML=items.slice(0,5).map(x=>`<button class="${state.page===x[0]?'active':''}" onclick="go('${x[0]}')"><div>${x[2]}</div>${x[1]}</button>`).join('')}
async function go(page){state.page=page;renderNav();await loadPage(true);startPoll()}
async function loadPage(first=false){try{const d=await apiGet('live',{page:state.page});state.data=d;if(first||['dashboard','empty','boilerEmpty','reports','approvals','audit','settings','driver'].includes(state.page))render();const pendingCount=Number(d.dashboard.counts.pending||0);const seenCount=Number(sessionStorage.getItem('approvalNoticeCount')||0);if(pendingCount>seenCount&&state.user.role==='admin'&&state.page!=='approvals'){sessionStorage.setItem('approvalNoticeCount',String(pendingCount));showApprovalsPopup(d.pendingApprovals||[])}$('offline').textContent='LIVE';}catch(e){$('offline').textContent='OFFLINE';if(first)toast(e.message)}}
function startPoll(){clearInterval(state.timer);state.timer=setInterval(()=>loadPage(false),CONFIG.POLL_MS)}
function render(){renderNav();const d=state.data||{};const c=d.dashboard?.counts||{};let h=`<div class="section-head"><h1>${pageTitle()}</h1><div class="actions"><button class="refresh" onclick="loadPage(true)" title="Refresh">↻</button></div></div>`;if(state.page==='dashboard')h+=dashboardHTML(d.dashboard);else if(state.page==='load')h+=loadHTML(d.page);else if(state.page==='boilerLoad')h+=loadHTML(d.page,true);else if(state.page==='empty')h+=emptyHTML(d.page);else if(state.page==='boilerEmpty')h+=emptyHTML(d.page,true);else if(state.page==='reports')h+=reportsHTML(d.page);else if(state.page==='approvals')h+=approvalHTML(d.page?.approvals||[]);else if(state.page==='audit')h+=auditHTML(d.page?.audit||[]);else if(state.page==='settings')h+=settingsHTML(d.page);else if(state.page==='driver')h+=driverHTML(d.page);$('main').innerHTML=h}
function pageTitle(){return ({dashboard:'Dashboard',load:'Load Tank',boilerLoad:'Load Boiler',empty:'Empty Tank',boilerEmpty:'Empty Boiler',reports:'Reports',approvals:'Pending Verification',audit:'Audit Trail',settings:'Settings',driver:'Grabber Account'})[state.page]||'ENICAN MINES'}
function dashboardHTML(d){const c=d.counts;return `<div class="grid stats"><div class="stat"><small>Occupied Tanks</small><strong>${c.tankOccupied}</strong></div><div class="stat"><small>Vacant Tanks</small><strong>${c.tankVacant}</strong></div><div class="stat"><small>Occupied Boilers</small><strong>${c.boilerOccupied}</strong></div><div class="stat"><small>Vacant Boilers</small><strong>${c.boilerVacant}</strong></div></div>${c.pending?`<div class="banner">${c.pending} invoice(s) waiting for admin price verification. <button class="btn secondary" onclick="go('approvals')">Review</button></div>`:''}<h2 style="margin:0 0 12px">Tanks</h2><div class="grid cards">${assetsHTML(d.tanks,'tank')}</div><h2 style="margin:22px 0 12px">Boilers</h2><div class="grid cards">${assetsHTML(d.boilers,'boiler')}</div>`}
function assetsHTML(arr,type){return arr.length?arr.map(a=>`<button class="asset" onclick="assetClick('${a.id}','${type}')"><div class="asset-top"><h3>${esc(a.name)}</h3><span class="status ${a.status.toLowerCase()}">${esc(a.status)}</span></div><div class="asset-meta">${a.status==='OCCUPIED'?'Session active':'Available for loading'}<br>${a.updatedAt?new Date(a.updatedAt).toLocaleString():''}</div></button>`).join(''):`<div class="panel empty">No ${type}s configured yet.</div>`}
async function assetClick(id,type){const d=state.data.dashboard[type==='tank'?'tanks':'boilers'].find(x=>x.id===id);if(!d)return;if(d.status==='VACANT'){showModal(d.name,`<div class="empty">This ${type} is vacant.</div>`);return}try{const s=await apiGet('session',{sessionId:d.sessionId});showModal(`${esc(d.name)} · ${esc(s.session.invoice)}`,sessionModalHTML(s,type))}catch(e){toast(e.message)}}
function sessionModalHTML(d,type){const s=d.session;return `<div class="grid stats" style="grid-template-columns:repeat(3,1fr)"><div class="stat"><small>Customer</small><strong style="font-size:17px">${esc(s.customerName)}</strong></div><div class="stat"><small>Amount Due</small><strong style="font-size:17px">${money(s.balance)}</strong></div><div class="stat"><small>Days Left</small><strong style="font-size:17px">${daysLeft(s.dueDate)}</strong></div></div><p class="sub">Phone: ${esc(s.customerPhone)} · ${esc(s.assetNames)}</p>${itemsTable(d.items)}<div class="pdf-actions"><button class="btn secondary" onclick="openCustomer('${s.customerId}')">Open Sessions</button><button class="btn primary" onclick="printStatement('${s.id}')">Download Statement</button></div>`}
function daysLeft(d){return Math.max(0,Math.ceil((new Date(d)-new Date())/86400000))}
function itemsTable(items){return `<div class="table-wrap"><table class="table"><thead><tr><th>Expense</th><th>Description</th><th>Qty</th><th>Price</th><th>Total</th></tr></thead><tbody>${items.map(i=>`<tr><td>${esc(i.expenseName)}</td><td>${esc(i.description)}</td><td>${i.qty}</td><td>${money(i.price)}</td><td>${money(i.total)}</td></tr>`).join('')}</tbody></table></div>`}
async function openCustomer(id){try{const d=await apiGet('customer',{customerId:id});showModal('Customer Sessions',`<div class="panel"><h3>${esc(d.customer.name)}</h3><div class="sub">${esc(d.customer.phone)} · ${esc(d.customer.address)}</div></div>${d.sessions.length?d.sessions.map(s=>`<button class="asset" style="width:100%;margin-bottom:8px" onclick="openSession('${s.id}')"><div class="asset-top"><h3>${esc(s.invoice)}</h3><span class="status occupied">OPEN</span></div><div class="asset-meta">${esc(s.assetNames)} · Balance ${money(s.balance)} · ${daysLeft(s.dueDate)} days left</div></button>`).join(''):`<div class="empty">No active sessions for this customer.</div>`}`)}catch(e){toast(e.message)}}
async function openSession(id){try{const s=await apiGet('session',{sessionId:id});showModal(s.session.invoice,sessionModalHTML(s,s.session.account==='BOILER'?'boiler':'tank'))}catch(e){toast(e.message)}}
function loadHTML(d,isBoiler=false){const a=d.account, assets=d.assets||[], ex=d.expenses||[];return `<div class="panel"><div class="toolbar"><div class="search" style="flex:1"><span>⌕</span><input id="customerSearch" placeholder="Search customer..." oninput="filterCustomers()"></div><button class="btn secondary" onclick="newCustomer('${a}')">＋ Add New Customer</button></div><div id="customerList" class="chips" style="margin-top:14px">${d.customers.map(c=>`<button class="chip" data-name="${esc((c.name+' '+c.phone).toLowerCase())}" onclick="selectCustomer('${c.id}','${a}')">${esc(c.name)} <span class="sub">${esc(c.phone)}</span></button>`).join('')}</div></div><div id="loadStage2" class="panel hidden"></div><div id="loadStage3" class="panel hidden"></div>`}
function filterCustomers(){const q=$('customerSearch').value.toLowerCase();document.querySelectorAll('#customerList .chip').forEach(x=>x.style.display=x.dataset.name.includes(q)?'':'none')}
let loadDraft={};
function newCustomer(account){showModal('Add New Customer',`<form class="stack" onsubmit="event.preventDefault();saveNewCustomer('${account}')"><div class="field"><label>Customer name</label><input id="ncName" required></div><div class="field"><label>Phone</label><input id="ncPhone"></div><div class="field"><label>Address</label><input id="ncAddress"></div><button class="btn primary">Save & Continue</button></form>`)}
async function saveNewCustomer(account){try{const d=await apiWrite('saveCustomer',{name:$('ncName').value,phone:$('ncPhone').value,address:$('ncAddress').value});closeModal();selectCustomer(d.customer.id,account)}catch(e){toast(e.message)}}
function selectCustomer(id,account){const d=state.data.page;const c=d.customers.find(x=>x.id===id);loadDraft={account,customer:c,assets:[],items:d.expenses.map(e=>({...e,price:e.defaultPrice,cost:e.defaultCost,qty:1,description:e.name}))};$('loadStage2').classList.remove('hidden');$('loadStage2').innerHTML=`<h3>Stage 2 · Select ${account==='BOILER'?'Boilers':'Tanks'}</h3><p class="sub">${esc(c.name)} · ${esc(c.phone)}</p><div class="chips">${d.assets.map(a=>`<button class="chip" id="asset-${a.id}" onclick="toggleAsset('${a.id}')">${esc(a.name)}</button>`).join('')}</div><div style="margin-top:14px"><button class="btn primary" onclick="stage3()">Continue</button></div>`;window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})}
function toggleAsset(id){const i=loadDraft.assets.indexOf(id);if(i>=0){loadDraft.assets.splice(i,1);$('asset-'+id).classList.remove('selected')}else{loadDraft.assets.push(id);$('asset-'+id).classList.add('selected')}}
function stage3(){if(!loadDraft.assets.length)return toast('Select at least one asset.');const ex=loadDraft.items;loadDraft.items=ex;$('loadStage3').classList.remove('hidden');$('loadStage3').innerHTML=`<h3>Stage 3 · Expenses for all selected ${loadDraft.account==='BOILER'?'boilers':'tanks'}</h3><p class="sub">Remove an expense and it is removed from every selected asset. Additions are also applied to every selected asset.</p><div id="expenseRows">${ex.map((x,i)=>expenseRow(x,i)).join('')}</div><div class="toolbar" style="margin-top:12px"><button class="btn secondary" onclick="addExpenseRow()">＋ Additional Expense</button><button class="btn primary" onclick="submitLoad()">Complete Load</button></div>`;window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})}
function expenseRow(x,i){return `<div class="panel" data-exp="${i}" style="margin-bottom:10px"><div class="form-grid"><div class="field"><label>Expense</label><input value="${esc(x.name)}" readonly></div><div class="field"><label>Description</label><input id="desc-${i}" value="${esc(x.description)}"></div><div class="field"><label>Cost</label><input id="cost-${i}" type="number" step="0.01" value="${x.cost}" onchange="draftPrice(${i})"></div><div class="field"><label>Selling price</label><input id="price-${i}" type="number" step="0.01" value="${x.price}" onchange="draftPrice(${i})"></div></div><div class="toolbar" style="margin-top:9px"><span class="sub">Per asset: ${money(x.price)}</span><button class="btn danger" onclick="removeExpense(${i})">Remove from all</button></div></div>`}
function draftPrice(i){loadDraft.items[i].price=Number($('price-'+i).value||0);loadDraft.items[i].cost=Number($('cost-'+i).value||0);loadDraft.items[i].description=$('desc-'+i).value}
function removeExpense(i){loadDraft.items.splice(i,1);stage3()}
function addExpenseRow(){loadDraft.items.push({id:'ADD-'+Date.now(),name:'Additional expense',defaultCost:0,defaultPrice:0,cost:0,price:0,qty:1,description:''});stage3()}
async function submitLoad(){loadDraft.items.forEach((x,i)=>{draftPrice(i)});if(!loadDraft.items.length)return toast('At least one expense is required.');try{const d=await apiWrite('loadSession',{account:loadDraft.account,customerId:loadDraft.customer.id,assetIds:loadDraft.assets,items:loadDraft.items.map(x=>({expenseId:x.id,name:x.name,price:x.price,cost:x.cost,qty:x.qty,description:x.description,durationDays:x.durationDays}))});toast(d.message||('Invoice '+d.invoice+' created'));loadDraft={};await loadPage(true)}catch(e){toast(e.message)}}
function emptyHTML(d,isBoiler){const ss=d.sessions||[];return `<div class="panel"><div class="search"><span>⌕</span><input placeholder="Search open sessions..." oninput="filterOpenSessions()" id="openSearch"></div></div><div id="openSessions">${ss.length?ss.map(s=>`<button class="asset" style="width:100%;margin-bottom:10px;text-align:left" data-search="${esc((s.invoice+' '+s.customerName).toLowerCase())}" onclick="paySession('${s.id}')"><div class="asset-top"><h3>${esc(s.invoice)} · ${esc(s.customerName)}</h3><span class="status occupied">OPEN</span></div><div class="asset-meta">${esc(s.assetNames)} · Due ${money(s.balance)} · ${daysLeft(s.dueDate)} days left</div></button>`).join(''):`<div class="panel empty">No open sessions.</div>`}</div>`}
function filterOpenSessions(){const q=$('openSearch').value.toLowerCase();document.querySelectorAll('#openSessions .asset').forEach(x=>x.style.display=x.dataset.search.includes(q)?'':'none')}
async function paySession(id){try{const s=await apiGet('session',{sessionId:id});const x=s.session;showModal('Empty Tank · '+x.invoice,`${itemsTable(s.items)}<div class="panel"><div class="grid stats" style="grid-template-columns:repeat(3,1fr)"><div class="stat"><small>Invoice</small><strong style="font-size:17px">${esc(x.invoice)}</strong></div><div class="stat"><small>Total</small><strong style="font-size:17px">${money(x.subtotal)}</strong></div><div class="stat"><small>Balance</small><strong style="font-size:17px">${money(x.balance)}</strong></div></div><form class="stack" onsubmit="event.preventDefault();makePayment('${x.id}')"><div class="form-grid"><div class="field"><label>Amount received</label><input id="payAmount" type="number" step="0.01" max="${x.balance}" value="${x.balance}" required></div><div class="field"><label>Payment method</label><select id="payMethod"><option>CASH</option><option>BANK</option><option>ECOCASH</option><option>OTHER</option></select></div></div><button class="btn primary">Record Payment</button></form></div>`)}catch(e){toast(e.message)}}
async function makePayment(id){try{const d=await apiWrite('pay',{sessionId:id,amount:$('payAmount').value,method:$('payMethod').value});toast(d.completed?'Paid in full. Tank/boiler is now vacant.':'Payment recorded.');await downloadPdf(id,'Receipt');if(d.completed)closeModal();await loadPage(true)}catch(e){toast(e.message)}}
function reportsHTML(d){const a=d.accounts||{};if(state.user.role==='driver')return `<div class="panel"><div class="toolbar"><div><h3>Grabber Account</h3><div class="sub">Revenue vs expenses</div></div><div style="margin-left:auto"><button class="btn primary" onclick="openAccountReport('GRABBER')">Filter Reports</button></div></div></div><div class="grid report-boxes"><div class="report-box"><h3>Revenue</h3><strong>${money(a.GRABBER?.revenue)}</strong></div><div class="report-box"><h3>Expenses</h3><strong>${money(a.GRABBER?.expenses)}</strong></div><div class="report-box"><h3>Profit</h3><strong>${money(a.GRABBER?.profit)}</strong></div></div>`;return `<div class="grid report-boxes"><button class="report-box" onclick="openAccountReport('TANK')"><h3>Tanks Account</h3><strong>${money(a.TANK?.profit)}</strong><div class="sub">Profit · ${a.TANK?.completedInvoices||0} completed</div></button><button class="report-box" onclick="openAccountReport('BOILER')"><h3>Boiler Account</h3><strong>${money(a.BOILER?.profit)}</strong><div class="sub">Profit · ${a.BOILER?.completedInvoices||0} completed</div></button><button class="report-box" onclick="openAccountReport('GRABBER')"><h3>Grabber Account</h3><strong>${money(a.GRABBER?.profit)}</strong><div class="sub">Profit · ${a.GRABBER?.completedInvoices||0} trips</div></button></div>${state.user.role==='admin'?`<div class="grid stats"><div class="stat"><small>Overall Revenue</small><strong>${money(d.overall.revenue)}</strong></div><div class="stat"><small>Overall Expenses</small><strong>${money(d.overall.expenses)}</strong></div><div class="stat"><small>Overall Profit</small><strong>${money(d.overall.profit)}</strong></div><div class="stat"><small>Period</small><strong style="font-size:16px">${esc(d.from)} → ${esc(d.to)}</strong></div></div>`:''}`}
async function openAccountReport(account){showModal(account+' Account',`<div class="stack"><div class="form-grid"><div class="field"><label>From</label><input id="rf" type="date"></div><div class="field"><label>To</label><input id="rt" type="date"></div></div><button class="btn primary" onclick="loadAccountReport('${account}')">Load Report</button><div id="accountReport"></div></div>`);}
async function loadAccountReport(account){try{const d=await apiGet('reportAccount',{account,from:$('rf').value,to:$('rt').value,offset:0,limit:100});$('accountReport').innerHTML=`<div class="grid stats" style="grid-template-columns:repeat(3,1fr);margin-top:12px"><div class="stat"><small>Revenue</small><strong>${money(d.summary.revenue)}</strong></div><div class="stat"><small>Expenses</small><strong>${money(d.summary.expenses)}</strong></div><div class="stat"><small>Profit</small><strong>${money(d.summary.profit)}</strong></div></div><div class="table-wrap"><table class="table"><thead><tr><th>Date</th><th>Invoice / Type</th><th>Customer / Description</th><th>Revenue</th><th>Expense</th><th>User</th></tr></thead><tbody>${d.rows.map(r=>`<tr ${r.invoice&&r.id?`onclick="openSession('${r.id}')" style="cursor:pointer"`:''}><td>${esc(r.date)}</td><td>${esc(r.invoice||r.type||'')}</td><td>${esc(r.customerName||r.description||'')}</td><td>${money(r.revenue)}</td><td>${money(r.expenses||r.expense)}</td><td>${esc(r.user)}</td></tr>`).join('')}</tbody></table></div>`}catch(e){toast(e.message)}}
function approvalHTML(rows){return rows.length?rows.map(x=>`<div class="panel approval"><div class="toolbar"><div><h3>${esc(x.session.invoice)}</h3><div class="sub">${esc(x.session.customerName)} · Loader: ${esc(x.approval.loaderName)} · ${esc(x.session.assetNames)}</div></div><div style="margin-left:auto"><button class="btn primary" onclick="review('${x.approval.id}',true)">Approve</button> <button class="btn danger" onclick="review('${x.approval.id}',false)">Decline</button></div></div>${itemsTable(x.items)}<p class="sub">Invoice total: ${money(x.session.subtotal)}</p></div>`).join(''):`<div class="panel empty">No pending price changes.</div>`}
async function review(id,approve){let reason='';if(!approve){reason=prompt('Reason for declining this invoice:')||'Declined by admin';}try{const d=await apiWrite(approve?'approve':'decline',{approvalId:id,reason});toast(d.status);await loadPage(true)}catch(e){toast(e.message)}}
function showApprovalsPopup(rows){if(!rows.length)return;showModal('Pending Verification',approvalHTML(rows))}
function auditHTML(rows){return `<div class="panel table-wrap"><table class="table"><thead><tr><th>Time</th><th>Action</th><th>Entity</th><th>Invoice</th><th>User</th><th>Details</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.timestamp)}</td><td>${esc(r.action)}</td><td>${esc(r.entity)}</td><td>${esc(r.invoice)}</td><td>${esc(r.username)}</td><td>${esc(r.details)}</td></tr>`).join('')}</tbody></table></div>`}
function settingsHTML(d){return `<div class="panel"><h3>API Connection</h3><div class="sub" style="word-break:break-all">${esc(CONFIG.API_URL)}</div></div><div class="panel"><h3>Create Account</h3><form class="form-grid" onsubmit="event.preventDefault();createUser()"><div class="field"><label>Username</label><input id="newUser" required></div><div class="field"><label>Password</label><input id="newPass" type="password" required></div><div class="field"><label>Role</label><select id="newRole"><option>loader</option><option>boiler</option><option>driver</option><option>admin</option></select></div><div style="display:flex;align-items:end"><button class="btn primary">Create Account</button></div></form></div><div class="panel"><h3>Add Tank / Boiler</h3><div class="toolbar"><input id="assetName" placeholder="Asset name"><select id="assetType"><option value="TANK">Tank</option><option value="BOILER">Boiler</option></select><button class="btn primary" onclick="addAsset()">Add</button></div></div><div class="panel"><h3>Accounts</h3>${(d.accounts||[]).map(a=>`<div class="toolbar" style="padding:10px 0;border-bottom:1px solid var(--line)"><strong>${esc(a.username)}</strong><span class="sub">${esc(a.role)}</span><span style="margin-left:auto">${a.active?'Active':'Disabled'}</span></div>`).join('')}</div><div class="panel"><h3>Defined Expenses</h3><p class="sub">Add/edit predefined expenses in the Sheets named TANK_EXPENSES and BOILER_EXPENSES. Their default prices are automatically applied to every selected asset.</p><div class="toolbar"><input id="expName" placeholder="Expense name"><input id="expCost" type="number" step="0.01" placeholder="Cost"><input id="expPrice" type="number" step="0.01" placeholder="Selling price"><select id="expAccount"><option>TANK</option><option>BOILER</option></select><button class="btn primary" onclick="addExpense()">Add Expense</button></div></div>`}
function saveApiUrl(){toast('The Web App URL is fixed in the application.');}
async function createUser(){try{await apiWrite('createAccount',{username:$('newUser').value,password:$('newPass').value,role:$('newRole').value});toast('Account created');$('newUser').value='';$('newPass').value='';await loadPage(true)}catch(e){toast(e.message)}}
async function addAsset(){try{await apiWrite('saveAsset',{name:$('assetName').value,account:$('assetType').value});$('assetName').value='';toast('Asset added');await loadPage(true)}catch(e){toast(e.message)}}
async function addExpense(){try{await apiWrite('saveExpense',{name:$('expName').value,cost:$('expCost').value,price:$('expPrice').value,account:$('expAccount').value,durationDays:$('expAccount').value==='BOILER'?1:10});toast('Expense added');await loadPage(true)}catch(e){toast(e.message)}}
function driverHTML(d){return `<div class="panel"><h3>Log Grabber Trip</h3><form class="form-grid" onsubmit="event.preventDefault();logTrip()"><div class="field"><label>Customer</label><select id="tripCustomer">${(d.customers||[]).map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>Amount</label><input id="tripAmount" type="number" step="0.01" required></div><div class="field"><label>Date</label><input id="tripDate" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Description</label><input id="tripDesc" value="Grabber trip"></div><button class="btn primary">Save Trip</button></form></div><div class="panel"><h3>Daily Expense</h3><form class="form-grid" onsubmit="event.preventDefault();logDriverExpense()"><div class="field"><label>Description</label><input id="deDesc" required></div><div class="field"><label>Amount</label><input id="deAmount" type="number" step="0.01" required></div><div class="field"><label>Date</label><input id="deDate" type="date" value="${new Date().toISOString().slice(0,10)}"></div><button class="btn primary">Save Expense</button></form></div><div class="grid report-boxes"><div class="report-box"><h3>Revenue</h3><strong>${money(d.summary?.revenue)}</strong></div><div class="report-box"><h3>Expenses</h3><strong>${money(d.summary?.expenses)}</strong></div><div class="report-box"><h3>Profit</h3><strong>${money(d.summary?.profit)}</strong></div></div>`}
async function logTrip(){try{await apiWrite('driverTrip',{customerId:$('tripCustomer').value,amount:$('tripAmount').value,tripDate:$('tripDate').value,description:$('tripDesc').value});toast('Trip saved');await loadPage(true)}catch(e){toast(e.message)}}
async function logDriverExpense(){try{await apiWrite('driverExpense',{description:$('deDesc').value,amount:$('deAmount').value,expenseDate:$('deDate').value});toast('Expense saved');await loadPage(true)}catch(e){toast(e.message)}}
async function downloadPdf(id,type){try{const d=await apiGet('pdf',{sessionId:id,type});const a=document.createElement('a');a.href='data:'+d.mimeType+';base64,'+d.base64;a.download=d.fileName;document.body.appendChild(a);a.click();a.remove();return true}catch(e){toast(e.message);return false}}
function printStatement(id){downloadPdf(id,'Statement').then(()=>toast('Statement downloaded.'))}

function logout(){state.token=null;state.user=null;localStorage.removeItem('enican_session');clearInterval(state.timer);$('app').classList.add('hidden');$('loginView').classList.remove('hidden')}
async function login(e){e.preventDefault();$('loginError').textContent='';try{if(!CONFIG.API_URL)throw new Error('Web App URL is not configured.');const d=await apiGet('login',{username:$('loginUser').value,password:$('loginPass').value,role:$('loginRole').value});if(!d.token)throw new Error(d.error||'Invalid credentials');state.token=d.token;state.user=d.user;localStorage.setItem('enican_session',JSON.stringify({token:d.token,user:d.user}));$('loginView').classList.add('hidden');$('app').classList.remove('hidden');$('userPill').textContent=d.user.username+' · '+d.user.role;state.page='dashboard';await loadPage(true);startPoll()}catch(err){$('loginError').textContent=err.message}}
$('loginForm').addEventListener('submit',login);
window.addEventListener('online',()=>{if(state.token)loadPage(true)});window.addEventListener('offline',()=>$('offline').textContent='OFFLINE');
(function boot(){try{const s=JSON.parse(localStorage.getItem('enican_session')||'null');if(s){state.token=s.token;state.user=s.user;$('loginView').classList.add('hidden');$('app').classList.remove('hidden');$('userPill').textContent=s.user.username+' · '+s.user.role;loadPage(true);startPoll()}}catch(e){logout()}})();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
